      function bindViewEvents() {
        viewRoot.querySelectorAll("[data-action='toggle-simulation']").forEach(button => button.addEventListener("click", toggleSimulation));
        viewRoot.querySelectorAll("[data-action='new-run']").forEach(button => button.addEventListener("click", beginNewRun));
        viewRoot.querySelectorAll("[data-action='end-run']").forEach(button => button.addEventListener("click", () => {
          if (window.confirm(t("confirmEnd"))) finishRun();
        }));
        viewRoot.querySelectorAll("[data-action='toggle-store']").forEach(button => button.addEventListener("click", toggleStore));
        viewRoot.querySelectorAll("[data-action='purchase']").forEach(button => button.addEventListener("click", purchaseInventory));
        viewRoot.querySelectorAll("[data-view-link]").forEach(button => button.addEventListener("click", () => setView(button.dataset.viewLink)));
        const durationInput = viewRoot.querySelector("#day-duration");
        if (durationInput) durationInput.addEventListener("change", () => {
          state.dayDurationSeconds = Math.min(200, Math.max(10, Math.round(Number(durationInput.value) || 10)));
          durationInput.value = String(state.dayDurationSeconds);
          state.pausedRemainingMs = state.dayDurationSeconds * 1000;
          saveState();
          updateLiveDisplay(Date.now());
        });
        const priceInput = viewRoot.querySelector("#selling-price");
        if (priceInput) priceInput.addEventListener("input", () => {
          state.currentPrice = Math.min(1200, Math.max(80, Number(priceInput.value)));
          const output = viewRoot.querySelector("#price-output");
          if (output) output.value = money(state.currentPrice);
          saveState();
        });
        if (priceInput) priceInput.addEventListener("change", () => {
          recordOperation("price_changed", { price: state.currentPrice });
          saveState();
        });
        const citySelect = viewRoot.querySelector("#city-select");
        if (citySelect) citySelect.addEventListener("change", () => changeLocation(citySelect.value, storeByCity(citySelect.value).size));
        const sizeSelect = viewRoot.querySelector("#store-size-select");
        if (sizeSelect) sizeSelect.addEventListener("change", () => changeLocation(state.city, sizeSelect.value));
        const purchaseStore = viewRoot.querySelector("#purchase-store");
        if (purchaseStore) purchaseStore.addEventListener("change", () => {
          state.purchaseCity = purchaseStore.value;
          saveState();
          render();
        });
        viewRoot.querySelectorAll(".city-marker").forEach(marker => {
          marker.addEventListener("click", () => changeLocation(marker.dataset.city, storeByCity(marker.dataset.city).size));
          marker.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              changeLocation(marker.dataset.city, storeByCity(marker.dataset.city).size);
            }
          });
        });
        const addForm = viewRoot.querySelector("#team-add-form");
        if (addForm) addForm.addEventListener("submit", event => {
          event.preventDefault();
          const data = new FormData(addForm);
          const name = String(data.get("name") || "").trim();
          const role = String(data.get("role") || "Operations");
          if (!name) return;
          state.team.push({ id: `member-${Date.now()}-${Math.random().toString(16).slice(2, 6)}`, name, role });
          state.activity.unshift({ icon: "♧", kind: "memberJoined", name, role, day: state.day });
          state.activity = state.activity.slice(0, 12);
          saveState();
          render();
          showToast(t("added", { name }));
        });
        viewRoot.querySelectorAll("[data-remove-member]").forEach(button => button.addEventListener("click", () => {
          const member = state.team.find(person => person.id === button.dataset.removeMember);
          if (!member) return;
          state.team = state.team.filter(person => person.id !== member.id);
          state.activity.unshift({ icon: "♧", kind: "memberRemoved", name: member.name, day: state.day });
          saveState();
          render();
          showToast(t("removed", { name: member.name }));
        }));
        viewRoot.querySelectorAll("[data-select-run]").forEach(button => button.addEventListener("click", () => {
          selectedRunId = button.dataset.selectRun;
          render();
        }));
        viewRoot.querySelectorAll("[data-download-run]").forEach(button => button.addEventListener("click", () => {
          const run = state.completedRuns.find(item => item.id === button.dataset.downloadRun);
          if (run) exportRun(run);
        }));
      }

      function changeLocation(city, size) {
        if (!cities.some(item => item.id === city)) return;
        const selected = storeByCity(city);
        const nextSize = size || selected.size;
        if (!storeSizes.some(item => item.id === nextSize)) return;
        if (sizeById(nextSize).capacity < selected.inventory + pendingForStore(selected)) {
          showToast(t("sizeTooSmall"));
          render();
          return;
        }
        const previousCity = state.city;
        const previousSize = selected.size;
        state.city = city;
        state.storeSize = nextSize;
        if (selected.isOpen) state.purchaseCity = city;
        selected.size = nextSize;
        if (previousCity !== city || previousSize !== nextSize) {
          recordOperation("location_changed", { city, size: nextSize });
        }
        saveState();
        render();
        if (previousCity !== city || previousSize !== nextSize) showToast(t("storeRented", { city: cityName(cityById()), size: sizeById(nextSize)[language] }));
      }

      function toggleStore() {
        if (state.isRunning) return;
        const store = storeByCity();
        store.isOpen = !store.isOpen;
        if (store.isOpen) state.purchaseCity = store.city;
        else if (!openStores().some(item => item.city === state.purchaseCity)) {
          state.purchaseCity = (openStores()[0] || {}).city || "";
        }
        state.storeSize = store.size;
        recordOperation(store.isOpen ? "store_opened" : "store_closed", { city: store.city, size: store.size });
        saveState();
        render();
        showToast(t(store.isOpen ? "storeOpenedToast" : "storeClosedToast", { city: cityName(cityById(store.city)) }));
      }

      function formatClock(milliseconds) {
        const totalSeconds = Math.max(0, Math.ceil(milliseconds / 1000));
        return `${String(Math.floor(totalSeconds / 60)).padStart(2, "0")}:${String(totalSeconds % 60).padStart(2, "0")}`;
      }

      function addSales(ticks) {
        if (ticks <= 0) return;
        const priceDemand = Math.max(0.2, 1.1 - (state.currentPrice - 450) * 0.0007);
        const satisfactionFactor = 0.75 + state.satisfaction / 200;
        for (const store of openStores()) {
          const chance = Math.min(.98, cityById(store.city).purchaseChance * priceDemand * satisfactionFactor);
          let units = 0;
          let stockoutSeconds = 0;
          for (let second = 0; second < ticks; second += 1) {
            if (Math.random() < chance) {
              if (store.inventory > 0) {
                store.inventory -= 1;
                units += 1;
              } else {
                stockoutSeconds += 1;
              }
            }
          }
          const revenue = units * state.currentPrice;
          store.dailyUnitsSold += units;
          store.dailyRevenue += revenue;
          store.dailyCogs += units * UNIT_COST;
          store.dailyStockoutSeconds += stockoutSeconds;
          state.dailyUnitsSold += units;
          state.dailyRevenue += revenue;
          state.dailyCogs += units * UNIT_COST;
          state.dailyStockoutSeconds += stockoutSeconds;
          state.cash += revenue;
        }
        state.lastRevenue = state.dailyRevenue;
        state.lastProfit = state.dailyRevenue - state.dailyCogs;
      }

      function deliverDueOrders(arrivingDay) {
        for (const store of state.stores) {
          const due = store.pendingDeliveries.filter(order => order.arrivesOn <= arrivingDay);
          if (!due.length) continue;
          const quantity = due.reduce((total, order) => total + order.quantity, 0);
          store.inventory += quantity;
          store.pendingDeliveries = store.pendingDeliveries.filter(order => order.arrivesOn > arrivingDay);
          state.activity.unshift({ icon: "⇢", kind: "deliveryReceived", count: quantity, city: store.city, day: arrivingDay });
        }
      }

      function closeDay(advance = true) {
        const completedDay = state.day;
        const profit = state.dailyRevenue - state.dailyCogs;
        const rent = dailyRent();
        const totalProfit = profit - rent;
        const storeBreakdown = openStores().map(store => ({
          city: store.city,
          revenue: store.dailyRevenue,
          profit: store.dailyRevenue - store.dailyCogs - storeRent(store),
          unitsSold: store.dailyUnitsSold,
          purchases: store.dailyPurchases,
          purchaseCost: store.dailyPurchaseCost,
          inventory: store.inventory,
          rent: storeRent(store)
        }));
        state.lastRevenue = state.dailyRevenue;
        state.lastProfit = totalProfit;
        if (openStores().length) {
          const satisfactionChange = state.dailyStockoutSeconds > 0
            ? -Math.min(5, Math.max(1, Math.ceil(state.dailyStockoutSeconds / state.dayDurationSeconds * 5)))
            : (state.currentPrice <= 450 ? 2 : -1);
          state.satisfaction = Math.min(98, Math.max(35, state.satisfaction + satisfactionChange));
        }
        state.history.push({
          day: completedDay,
          revenue: state.dailyRevenue,
          profit: totalProfit,
          grossProfit: profit,
          rent,
          unitsSold: state.dailyUnitsSold,
          inventory: totalInventory(),
          purchases: state.dailyPurchases,
          purchaseCost: state.dailyPurchaseCost,
          price: state.currentPrice,
          stores: storeBreakdown
        });
        state.cash -= rent;
        state.activity.unshift({
          icon: profit >= 0 ? "↗" : "⚠",
          kind: "dayClosed",
          day: completedDay,
          units: state.dailyUnitsSold,
          revenue: state.dailyRevenue,
          profit: totalProfit,
          warning: totalProfit < 0
        });
        if (rent > 0) state.activity.unshift({ icon: "⌂", kind: "rentCharged", day: completedDay, rent, count: openStores().length });
        if (openStores().some(store => store.inventory === 0)) state.activity.unshift({ icon: "▣", kind: "lowInventoryActivity", day: completedDay, warning: true });
        state.activity = state.activity.slice(0, 12);
        recordOperation("day_settled", { day: completedDay, revenue: state.dailyRevenue, expenses: state.dailyPurchaseCost + rent, rent, endingCash: state.cash });
        if (!advance) return;
        state.day += 1;
        deliverDueOrders(state.day);
        state.dailyRevenue = 0;
        state.dailyCogs = 0;
        state.dailyUnitsSold = 0;
        state.dailyPurchaseCost = 0;
        state.dailyPurchases = 0;
        state.dailyStockoutSeconds = 0;
        state.salesRemainder = 0;
        state.stores.forEach(store => {
          store.dailyRevenue = 0;
          store.dailyCogs = 0;
          store.dailyUnitsSold = 0;
          store.dailyPurchases = 0;
          store.dailyPurchaseCost = 0;
          store.dailyStockoutSeconds = 0;
          store.salesRemainder = 0;
        });
        if (state.day > 30) {
          state.isRunning = false;
          state.dayStartedAt = null;
          state.dayEndsAt = null;
          state.lastTickAt = null;
          state.pausedRemainingMs = 0;
          archiveCurrentRun();
        }
      }

      function updateSimulation(now = Date.now()) {
        if (!state.isRunning) return false;
        let changed = false;
        let daysClosed = 0;
        while (state.isRunning && state.dayEndsAt <= now) {
          const deadline = state.dayEndsAt;
          const ticks = Math.floor(Math.max(0, deadline - state.lastTickAt) / 1000);
          addSales(ticks);
          closeDay();
          daysClosed += 1;
          changed = true;
          if (state.isRunning) {
            state.dayStartedAt = deadline;
            state.dayEndsAt = deadline + state.dayDurationSeconds * 1000;
            state.lastTickAt = deadline;
            state.pausedRemainingMs = state.dayDurationSeconds * 1000;
          }
        }
        if (state.isRunning) {
          const ticks = Math.floor(Math.max(0, now - state.lastTickAt) / 1000);
          if (ticks > 0) {
            addSales(ticks);
            state.lastTickAt += ticks * 1000;
            changed = true;
          }
        }
        if (changed) saveState();
        return daysClosed > 0;
      }

      function updateLiveDisplay(now = Date.now()) {
        const clock = viewRoot.querySelector("#day-clock");
        if (!clock) return;
        const remaining = state.isRunning
          ? Math.max(0, state.dayEndsAt - now)
          : (state.pausedRemainingMs || state.dayDurationSeconds * 1000);
        clock.textContent = formatClock(remaining);
        const progress = state.isRunning
          ? Math.min(100, Math.max(0, ((state.dayDurationSeconds * 1000 - remaining) / (state.dayDurationSeconds * 1000)) * 100))
          : 0;
        const fill = viewRoot.querySelector("#day-progress-fill");
        const progressBar = viewRoot.querySelector(".day-progress");
        if (fill) fill.style.width = `${progress}%`;
        if (progressBar) progressBar.setAttribute("aria-valuenow", String(Math.round(progress)));
        const dot = viewRoot.querySelector("#simulation-dot");
        const status = viewRoot.querySelector("#simulation-status");
        if (dot) dot.classList.toggle("running", state.isRunning);
        if (status) status.textContent = state.isRunning ? t("storeOpen") : t("storeClosed");
        const inventory = viewRoot.querySelector("#live-inventory");
        if (inventory) inventory.innerHTML = `${totalInventory().toLocaleString()} <span style="font-size:12px;font-weight:500;letter-spacing:0">${t("units")}</span>`;
        const cash = viewRoot.querySelector("#live-cash");
        if (cash) cash.textContent = money(state.cash, true);
        const revenue = viewRoot.querySelector("#live-revenue");
        if (revenue) revenue.textContent = money(state.dailyRevenue, true);
        const salesCaption = viewRoot.querySelector("#live-sales-caption");
        if (salesCaption) salesCaption.textContent = t("salesToday", { units: state.dailyUnitsSold });
        const profit = viewRoot.querySelector("#live-profit");
        if (profit) {
          profit.textContent = money(state.dailyRevenue - state.dailyCogs, true);
          profit.classList.toggle("positive", state.dailyRevenue > state.dailyCogs);
          profit.classList.toggle("negative", state.dailyRevenue < state.dailyCogs);
        }
        const units = viewRoot.querySelector("#today-units");
        if (units) units.textContent = `${state.dailyUnitsSold} ${t("units")}`;
        const dailyRevenue = viewRoot.querySelector("#today-revenue");
        if (dailyRevenue) dailyRevenue.textContent = money(state.dailyRevenue, true);
        viewRoot.querySelectorAll("[data-store-city]").forEach(card => {
          const store = storeByCity(card.dataset.storeCity);
          if (!store) return;
          const capacity = sizeById(store.size).capacity;
          const percent = Math.min(100, store.inventory / capacity * 100);
          const inventorySummary = card.querySelector("[data-store-inventory]");
          if (inventorySummary) inventorySummary.textContent = `${store.inventory} ${t("units")}`;
          const remainingSummary = card.querySelector(".stock-summary span");
          if (remainingSummary) remainingSummary.textContent = t("stockRemaining", { stock: store.inventory, capacity });
          const capacityBar = card.querySelector(".stock-capacity");
          if (capacityBar) capacityBar.classList.toggle("low", percent < 25);
          const stockFill = card.querySelector(".stock-capacity span");
          if (stockFill) stockFill.style.width = `${percent}%`;
          const shelfBoxes = card.querySelectorAll(".stock-box");
          const visibleBoxes = Math.min(shelfBoxes.length, Math.ceil(percent / 100 * shelfBoxes.length));
          shelfBoxes.forEach((box, index) => box.classList.toggle("empty", index >= visibleBoxes));
          const health = card.querySelector(".stock-legend span:nth-child(2)");
          if (health) {
            health.textContent = store.inventory === 0 ? t("noStock") : percent < 25 ? t("lowStock") : t("healthyStock");
            health.classList.toggle("low", store.inventory === 0 || percent < 25);
          }
        });
        const locationInventory = viewRoot.querySelector("#location-inventory");
        if (locationInventory && storeByCity().isOpen) locationInventory.textContent = `${storeByCity().inventory} ${t("units")}`;
        const procurementSelect = viewRoot.querySelector("#purchase-quantity");
        const targetSelect = viewRoot.querySelector("#purchase-store");
        const requestedStore = storeByCity(targetSelect ? targetSelect.value : state.purchaseCity);
        const targetStore = requestedStore && requestedStore.isOpen ? requestedStore : null;
        if (procurementSelect && targetStore && targetStore.isOpen) {
          const freeSpace = Math.max(0, sizeById(targetStore.size).capacity - targetStore.inventory - pendingForStore(targetStore));
          [...procurementSelect.options].forEach(option => { option.disabled = Number(option.value) > freeSpace; });
        }
        const deliveryNote = viewRoot.querySelector("#delivery-note");
        if (deliveryNote) deliveryNote.textContent = targetStore && targetStore.isOpen
          ? pendingForStore(targetStore)
            ? `${t("delivery")}: ${pendingForStore(targetStore).toLocaleString()} ${t("units")} · ${t("deliveryArrives", { day: earliestArrival(targetStore) })}`
            : t("noPendingDelivery")
          : t("noStoresOpen");
        const statusCash = viewRoot.querySelector(".procurement-copy small");
        if (statusCash) statusCash.textContent = t("perUnitCash", { cost: UNIT_COST, cash: money(state.cash, true) });
      }

      function toggleSimulation() {
        if (!state.runId) {
          beginNewRun();
          return;
        }
        const now = Date.now();
        if (state.isRunning) {
          updateSimulation(now);
          if (state.isRunning) {
            state.pausedRemainingMs = Math.max(0, state.dayEndsAt - now);
            state.isRunning = false;
            state.runStatus = "paused";
            recordOperation("practice_paused", { remainingMs: state.pausedRemainingMs });
          }
          saveState();
          render();
          showToast(t("paused"));
          return;
        }
        if (state.day > 30) {
          showToast(t("seasonComplete"));
          return;
        }
        const remaining = state.pausedRemainingMs > 0 ? state.pausedRemainingMs : state.dayDurationSeconds * 1000;
        state.isRunning = true;
        state.runStatus = "running";
        state.dayStartedAt = now - (state.dayDurationSeconds * 1000 - remaining);
        state.dayEndsAt = now + remaining;
        state.lastTickAt = now;
        state.pausedRemainingMs = remaining;
        recordOperation(state.operationLog.some(item => item.action === "practice_paused") ? "practice_resumed" : "simulation_started", { secondsRemaining: Math.ceil(remaining / 1000) });
        saveState();
        render();
        showToast(t("storeOpened", { seconds: state.dayDurationSeconds }));
      }

      function purchaseInventory() {
        const quantityInput = viewRoot.querySelector("#purchase-quantity");
        const targetSelect = viewRoot.querySelector("#purchase-store");
        const store = storeByCity(targetSelect ? targetSelect.value : state.purchaseCity);
        const quantity = quantityInput ? Number(quantityInput.value) : 25;
        const totalCost = quantity * UNIT_COST;
        if (!store || !store.isOpen) {
          showToast(t("storeRequired"));
          return;
        }
        if (quantity <= 0 || !Number.isInteger(quantity)) {
          showToast(t("invalidQuantity"));
          return;
        }
        const availableCapacity = sizeById(store.size).capacity - store.inventory - pendingForStore(store);
        if (quantity > availableCapacity) {
          showToast(t("capacityReached"));
          return;
        }
        if (state.cash < totalCost) {
          showToast(t("notEnoughCash", { amount: money(totalCost) }));
          return;
        }
        state.cash -= totalCost;
        store.pendingDeliveries.push({ quantity, arrivesOn: state.day + 1 });
        state.dailyPurchaseCost += totalCost;
        state.dailyPurchases += quantity;
        store.dailyPurchases += quantity;
        store.dailyPurchaseCost += totalCost;
        state.activity.unshift({ icon: "⇢", kind: "orderPlaced", count: quantity, amount: totalCost, city: store.city, arrivesOn: state.day + 1, day: state.day });
        recordOperation("inventory_ordered", { city: store.city, quantity, unitCost: UNIT_COST, totalCost, arrivesOn: state.day + 1, cashAfter: state.cash });
        state.activity = state.activity.slice(0, 12);
        saveState();
        render();
        showToast(t("stockAdded", { count: quantity, store: cityName(cityById(store.city)), day: state.day + 1 }));
      }

      function setView(view) {
        if (!pageInfo[view]) return;
        currentView = view;
        render();
      }

      function openCompanyDialog() {
        document.querySelector("#company-name-input").value = state.company.name;
        document.querySelector("#industry-input").value = state.company.industry;
        document.querySelector("#owner-name-input").value = state.company.owner;
        localizeCompanyDialog();
        document.querySelector("#company-dialog").showModal();
      }

      document.querySelectorAll(".nav-button").forEach(button => button.addEventListener("click", () => setView(button.dataset.view)));
      document.querySelector("#locale-toggle").addEventListener("click", () => {
        language = language === "en" ? "zh" : "en";
        state.language = language;
        saveState();
        render();
      });
      document.querySelector("#company-switcher").addEventListener("click", openCompanyDialog);
      document.querySelector("#edit-company-top").addEventListener("click", openCompanyDialog);
      document.querySelectorAll("[data-close-dialog]").forEach(button => button.addEventListener("click", () => document.querySelector("#company-dialog").close()));
      document.querySelector("#company-form").addEventListener("submit", event => {
        event.preventDefault();
        const data = new FormData(event.currentTarget);
        state.company.name = String(data.get("companyName")).trim();
        state.company.industry = String(data.get("industry"));
        state.company.owner = String(data.get("ownerName")).trim();
        saveState();
        document.querySelector("#company-dialog").close();
        render();
        showToast(t("companySaved"));
      });

      updateSimulation(Date.now());
      render();
      window.setInterval(() => {
        if (updateSimulation(Date.now())) render();
        else updateLiveDisplay(Date.now());
      }, 250);
    })();
  </script>
</body>
</html>
