<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Fieldwork — Business Simulation Lab</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f5f6f3;
      --surface: #fff;
      --surface-soft: #f8f9f7;
      --ink: #202820;
      --muted: #788078;
      --line: #e8ebe6;
      --green: #2f704e;
      --green-dark: #245c3e;
      --green-soft: #e8f2eb;
      --amber: #a56a1e;
      --amber-soft: #fbf1df;
      --red: #b44f46;
      --red-soft: #f9eae8;
      --shadow: 0 8px 26px rgb(29 44 31 / 5%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page: #151a16;
        --surface: #1e251f;
        --surface-soft: #252d26;
        --ink: #edf2eb;
        --muted: #a0aaa0;
        --line: #343e35;
        --green: #94cba4;
        --green-dark: #b4dfbd;
        --green-soft: #293a2d;
        --amber: #e5ba72;
        --amber-soft: #3a3021;
        --red: #e59186;
        --red-soft: #3b2927;
        --shadow: 0 8px 26px rgb(0 0 0 / 15%);
      }
    }

    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; background: var(--page); color: var(--ink); font-size: 14px; }
    button, input, select { font: inherit; }
    button { color: inherit; }
    .layout { display: grid; grid-template-columns: 238px minmax(0, 1fr); min-height: 100vh; }

    .sidebar {
      position: sticky;
      top: 0;
      display: flex;
      height: 100vh;
      flex-direction: column;
      padding: 22px 14px 16px;
      border-right: 1px solid var(--line);
      background: var(--surface);
    }

    .brand { display: flex; align-items: center; gap: 11px; padding: 2px 10px 24px; }
    .brand-mark { display: grid; width: 35px; height: 35px; place-items: center; border-radius: 11px; background: var(--green); color: #fff; font-size: 18px; font-weight: 750; }
    .brand-name { font-size: 15px; font-weight: 750; letter-spacing: -.03em; }
    .brand-caption { margin-top: 2px; color: var(--muted); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
    .company-switcher { display: flex; align-items: center; gap: 10px; margin: 0 2px 22px; padding: 11px 10px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-soft); text-align: left; cursor: pointer; }
    .company-icon { display: grid; flex: 0 0 30px; width: 30px; height: 30px; place-items: center; border-radius: 9px; background: var(--amber-soft); color: var(--amber); font-weight: 750; }
    .company-switcher-copy { overflow: hidden; flex: 1; }
    .company-switcher-copy strong, .company-switcher-copy small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .company-switcher-copy strong { font-size: 12px; }
    .company-switcher-copy small { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .company-chevron { color: var(--muted); }
    .nav-label { padding: 0 11px 9px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
    .nav { display: grid; gap: 4px; }
    .nav-button { display: flex; align-items: center; gap: 12px; min-height: 41px; padding: 0 11px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); cursor: pointer; text-align: left; transition: background .16s, color .16s; }
    .nav-button:hover { background: var(--surface-soft); color: var(--ink); }
    .nav-button[aria-current="page"] { background: var(--green-soft); color: var(--green-dark); font-weight: 650; }
    .nav-icon { display: grid; width: 18px; place-items: center; font-size: 16px; }
    .sidebar-spacer { flex: 1; }
    .season-card { margin: 12px 2px; padding: 13px; border: 1px solid var(--line); border-radius: 11px; background: linear-gradient(140deg, var(--green-soft), var(--surface)); }
    .season-label { color: var(--muted); font-size: 10px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
    .season-value { margin-top: 6px; font-size: 14px; font-weight: 700; }
    .season-sub { margin-top: 4px; color: var(--muted); font-size: 11px; }
    .profile { display: flex; align-items: center; gap: 10px; padding: 13px 8px 0; border-top: 1px solid var(--line); }
    .avatar { display: grid; flex: 0 0 33px; width: 33px; height: 33px; place-items: center; border-radius: 50%; background: #e9caa4; color: #61452a; font-size: 11px; font-weight: 750; }
    .profile strong, .profile small { display: block; }
    .profile strong { font-size: 12px; }
    .profile small { margin-top: 3px; color: var(--muted); font-size: 11px; }

    .main { width: min(100%, 1440px); margin: 0 auto; padding: 29px clamp(20px, 4vw, 54px) 48px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 32px; }
    .breadcrumbs { color: var(--muted); font-size: 12px; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .round-indicator { display: flex; align-items: center; gap: 8px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--muted); font-size: 12px; }
    .round-indicator strong { color: var(--ink); }
    .button { display: inline-flex; min-height: 37px; align-items: center; justify-content: center; gap: 7px; padding: 0 13px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); cursor: pointer; font-size: 12px; font-weight: 650; transition: transform .16s, background .16s, border-color .16s; }
    .button:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--green) 38%, var(--line)); }
    .button-primary { border-color: var(--green); background: var(--green); color: #fff; }
    .button-primary:hover { border-color: var(--green-dark); background: var(--green-dark); }
    .button-danger { border-color: color-mix(in srgb, var(--red) 35%, var(--line)); color: var(--red); }
    .button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .button:focus-visible, .nav-button:focus-visible, .company-switcher:focus-visible { outline: 3px solid color-mix(in srgb, var(--green) 28%, transparent); outline-offset: 2px; }

    .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 24px; }
    .page-kicker { margin: 0 0 7px; color: var(--green); font-size: 11px; font-weight: 750; letter-spacing: .11em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(26px, 4vw, 32px); font-weight: 670; letter-spacing: -.045em; }
    .page-description { margin: 7px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .heading-actions { display: flex; align-items: center; gap: 8px; }

    .alert { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 18px; padding: 12px 14px; border: 1px solid color-mix(in srgb, var(--amber) 22%, var(--line)); border-radius: 10px; background: var(--amber-soft); color: var(--amber); font-size: 12px; line-height: 1.5; }
    .alert-icon { font-size: 15px; }
    .metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 17px; }
    .metric { min-width: 0; padding: 15px 16px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
    .metric-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; color: var(--muted); font-size: 11px; }
    .metric-icon { color: var(--green); font-size: 16px; }
    .metric-value { overflow: hidden; margin-top: 13px; font-size: clamp(17px, 2vw, 23px); font-weight: 700; letter-spacing: -.04em; text-overflow: ellipsis; white-space: nowrap; }
    .metric-change { margin-top: 7px; color: var(--muted); font-size: 10px; }
    .metric-change.positive { color: var(--green); }
    .metric-change.negative { color: var(--red); }

    .content-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(270px, .95fr); gap: 16px; align-items: start; }
    .panel { min-width: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
    .panel + .panel { margin-top: 16px; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .panel-title { margin: 0; font-size: 13px; font-weight: 700; }
    .panel-subtitle { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .panel-body { padding: 17px 18px; }
    .chart-wrap { height: 208px; }
    .chart-wrap svg { width: 100%; height: 100%; overflow: visible; }
    .chart-grid { stroke: var(--line); stroke-width: 1; }
    .chart-area { fill: url(#chartFill); }
    .chart-line { fill: none; stroke: var(--green); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .chart-dot { fill: var(--surface); stroke: var(--green); stroke-width: 2; }
    .chart-label { fill: var(--muted); font: 10px Inter, ui-sans-serif, system-ui, sans-serif; }
    .chart-legend { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; }
    .legend-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }

    .decision-panel { overflow: hidden; }
    .decision-intro { padding: 15px 17px 2px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .decision-form { display: grid; gap: 0; }
    .decision-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 17px; border-top: 1px solid var(--line); }
    .decision-copy strong, .decision-copy small { display: block; }
    .decision-copy strong { font-size: 12px; }
    .decision-copy small { margin-top: 4px; color: var(--muted); font-size: 10px; }
    .decision-row select { width: 128px; height: 33px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; outline: none; background: var(--surface-soft); color: var(--ink); font-size: 11px; }
    .decision-row select:focus, input:focus, select:focus { border-color: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 14%, transparent); }
    .decision-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 17px; border-top: 1px solid var(--line); background: var(--surface-soft); }
    .decision-foot small { color: var(--muted); font-size: 10px; line-height: 1.4; }

    .simulation-bar { display: flex; align-items: center; gap: 10px; padding: 12px 17px; background: var(--surface-soft); }
    .simulation-status { display: flex; flex: 1; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .status-dot.running { background: #49a36a; box-shadow: 0 0 0 4px color-mix(in srgb, #49a36a 15%, transparent); animation: pulse 1.6s ease infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, #49a36a 0%, transparent); } }
    .day-clock { color: var(--ink); font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 700; }
    .day-progress { height: 4px; background: var(--line); }
    .day-progress > span { display: block; width: 0; height: 100%; background: var(--green); transition: width .25s linear; }
    .day-controls { display: flex; align-items: center; gap: 8px; padding: 13px 17px 15px; }
    .day-controls label { display: flex; flex: 1; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 11px; }
    .day-controls input { width: 96px; height: 33px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; outline: none; background: var(--surface); color: var(--ink); font-size: 11px; }
    .price-control { display: grid; gap: 8px; padding: 14px 17px; border-top: 1px solid var(--line); }
    .price-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .price-heading strong { font-size: 12px; }
    .price-heading output { color: var(--green); font-size: 17px; font-weight: 750; }
    .price-control input[type="range"] { width: 100%; accent-color: var(--green); cursor: pointer; }
    .price-range-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; }
    .procurement { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 9px; padding: 13px 17px; border-top: 1px solid var(--line); }
    .procurement-copy { grid-column: 1 / -1; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .procurement-copy strong { font-size: 12px; }
    .procurement-copy small { color: var(--muted); font-size: 10px; }
    .procurement select { min-width: 0; height: 37px; padding: 0 9px; border: 1px solid var(--line); border-radius: 8px; outline: none; background: var(--surface-soft); color: var(--ink); font-size: 11px; }
    .procurement .button { white-space: nowrap; }
    .purchase-target { grid-column: 1 / -1; display: grid; gap: 5px; color: var(--muted); font-size: 10px; font-weight: 650; }
    .delivery-note { grid-column: 1 / -1; color: var(--muted); font-size: 10px; line-height: 1.4; }
    .store-totals { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; padding: 0 17px 14px; }
    .store-total { padding: 9px 10px; border-radius: 8px; background: var(--surface-soft); }
    .store-total small, .store-total strong { display: block; }
    .store-total small { color: var(--muted); font-size: 10px; }
    .store-total strong { margin-top: 4px; font-size: 13px; font-variant-numeric: tabular-nums; }

    .locale-button { min-width: 46px; }
    .location-layout { display: grid; grid-template-columns: minmax(210px, .85fr) minmax(0, 1fr); gap: 16px; align-items: center; }
    .taiwan-map { width: 100%; max-height: 270px; }
    .taiwan-shape { fill: var(--green-soft); stroke: var(--green); stroke-width: 3; stroke-linejoin: round; }
    .map-label { fill: var(--muted); font: 10px Inter, ui-sans-serif, system-ui, sans-serif; }
    .city-marker { cursor: pointer; }
    .city-marker circle { fill: var(--surface); stroke: var(--green); stroke-width: 2; transition: r .16s, fill .16s; }
    .city-marker:hover circle, .city-marker.selected circle { fill: var(--green); }
    .city-marker.store-open:not(.selected) circle { fill: color-mix(in srgb, var(--green) 45%, var(--surface)); }
    .city-marker.selected circle { stroke: var(--green-dark); stroke-width: 3; }
    .city-marker text { fill: var(--ink); font: 10px Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 650; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
    .location-controls { display: grid; gap: 12px; }
    .location-controls label { display: grid; gap: 6px; color: var(--muted); font-size: 11px; font-weight: 650; }
    .location-controls select { width: 100%; height: 38px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; outline: none; background: var(--surface-soft); color: var(--ink); font-size: 12px; }
    .location-info { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .location-stat { padding: 10px; border-radius: 8px; background: var(--surface-soft); }
    .location-stat small, .location-stat strong { display: block; }
    .location-stat small { color: var(--muted); font-size: 10px; }
    .location-stat strong { margin-top: 5px; font-size: 13px; }
    .store-opening { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .map-note { color: var(--muted); font-size: 10px; line-height: 1.5; }
    .stock-visual { display: grid; gap: 13px; }
    .store-stock-list { display: grid; gap: 18px; }
    .store-stock { display: grid; gap: 13px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
    .store-stock:last-child { padding-bottom: 0; border-bottom: 0; }
    .stock-summary { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .stock-summary strong { font-size: 22px; letter-spacing: -.04em; }
    .stock-summary span { color: var(--muted); font-size: 11px; }
    .stock-capacity { height: 7px; overflow: hidden; border-radius: 99px; background: var(--line); }
    .stock-capacity span { display: block; height: 100%; border-radius: inherit; background: var(--green); transition: width .25s; }
    .stock-capacity.low span { background: var(--amber); }
    .stock-shelves { display: grid; gap: 9px; padding: 4px 2px 0; }
    .shelf-row { display: flex; min-height: 43px; align-items: flex-end; gap: 5px; padding: 0 9px 5px; border-bottom: 5px solid #b68b5c; border-radius: 2px 2px 5px 5px; background: linear-gradient(180deg, transparent 83%, color-mix(in srgb, #b68b5c 10%, transparent) 83%); }
    .stock-box { display: grid; width: 26px; height: 27px; place-items: center; border: 1px solid color-mix(in srgb, var(--green) 25%, var(--line)); border-radius: 5px 5px 3px 3px; background: linear-gradient(145deg, var(--green-soft), color-mix(in srgb, var(--green) 16%, var(--surface))); color: var(--green-dark); font-size: 13px; transition: opacity .2s, transform .2s; }
    .stock-box.empty { opacity: .2; transform: scaleY(.55); transform-origin: bottom; }
    .stock-legend { display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; }
    .stock-legend .low { color: var(--amber); font-weight: 700; }
    .stock-caption { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 11px; }
    .location-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .location-actions .button { flex: 1; }

    .team-list { display: grid; }
    .team-member { display: flex; align-items: center; gap: 11px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .team-member:first-child { padding-top: 1px; }
    .team-member:last-child { padding-bottom: 1px; border-bottom: 0; }
    .member-avatar { display: grid; flex: 0 0 34px; width: 34px; height: 34px; place-items: center; border-radius: 50%; background: var(--green-soft); color: var(--green-dark); font-size: 11px; font-weight: 750; }
    .member-copy { flex: 1; min-width: 0; }
    .member-copy strong, .member-copy small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .member-copy strong { font-size: 12px; }
    .member-copy small { margin-top: 3px; color: var(--muted); font-size: 10px; }
    .role-pill { padding: 4px 7px; border-radius: 6px; background: var(--surface-soft); color: var(--muted); font-size: 10px; }
    .team-footer { margin-top: 13px; }

    .activity-list { display: grid; }
    .activity-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .activity-item:last-child { border-bottom: 0; }
    .activity-mark { display: grid; flex: 0 0 25px; width: 25px; height: 25px; place-items: center; border-radius: 8px; background: var(--green-soft); color: var(--green); font-size: 12px; }
    .activity-mark.warning { background: var(--amber-soft); color: var(--amber); }
    .activity-copy { min-width: 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .activity-copy strong { color: var(--ink); font-weight: 650; }
    .activity-time { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; }

    .module-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }
    .module-card { padding: 17px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
    .module-card-icon { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 10px; background: var(--green-soft); color: var(--green); font-size: 17px; }
    .module-card h2 { margin: 13px 0 5px; font-size: 14px; }
    .module-card p { min-height: 34px; margin: 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .module-stat { margin-top: 15px; padding-top: 12px; border-top: 1px solid var(--line); }
    .module-stat small { display: block; color: var(--muted); font-size: 10px; }
    .module-stat strong { display: block; margin-top: 4px; font-size: 17px; }
    .module-tip { margin-top: 16px; padding: 13px 15px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-soft); color: var(--muted); font-size: 12px; line-height: 1.55; }

    .team-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .team-table { width: 100%; border-collapse: collapse; }
    .team-table th { padding: 11px 12px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 10px; font-weight: 650; text-align: left; text-transform: uppercase; letter-spacing: .06em; }
    .team-table td { padding: 12px; border-bottom: 1px solid var(--line); font-size: 12px; }
    .team-table tr:last-child td { border-bottom: 0; }
    .table-person { display: flex; align-items: center; gap: 9px; }
    .table-person .member-avatar { width: 30px; height: 30px; flex-basis: 30px; }
    .remove-member { border: 0; background: transparent; color: var(--red); cursor: pointer; font-size: 11px; }
    .team-add-form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 9px; margin-top: 16px; padding: 14px; border: 1px dashed var(--line); border-radius: 10px; background: var(--surface-soft); }
    .team-add-form input, .team-add-form select, .dialog-form input, .dialog-form select { min-width: 0; height: 37px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; outline: none; background: var(--surface); color: var(--ink); font-size: 12px; }

    .history-table { width: 100%; border-collapse: collapse; }
    .history-table th { padding: 10px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 10px; font-weight: 650; text-align: left; text-transform: uppercase; }
    .history-table td { padding: 11px 10px; border-bottom: 1px solid var(--line); font-size: 11px; }
    .history-table tr:last-child td { border-bottom: 0; }
    .status-positive { color: var(--green); }
    .status-negative { color: var(--red); }
    .empty-history { padding: 23px 10px; color: var(--muted); font-size: 12px; text-align: center; }
    .run-history-list { display: grid; gap: 9px; }
    .run-history-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
    .run-history-copy { min-width: 0; }
    .run-history-copy strong, .run-history-copy small { display: block; }
    .run-history-copy small { margin-top: 4px; color: var(--muted); font-size: 10px; }
    .run-history-actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .run-history-actions .button { min-height: 32px; padding: 0 9px; font-size: 10px; }
    .run-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 12px; }
    .operation-list { display: grid; gap: 0; }
    .operation-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 11px; }
    .operation-row:last-child { border-bottom: 0; }

    dialog { width: min(420px, calc(100% - 32px)); padding: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); box-shadow: 0 24px 80px rgb(0 0 0 / 22%); }
    dialog::backdrop { background: rgb(18 24 19 / 45%); backdrop-filter: blur(2px); }
    .dialog-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 17px 19px; border-bottom: 1px solid var(--line); }
    .dialog-head h2 { margin: 0; font-size: 15px; }
    .dialog-head p { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
    .dialog-close { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 19px; }
    .dialog-form { display: grid; gap: 13px; padding: 18px 19px; }
    .dialog-form label { display: grid; gap: 6px; color: var(--muted); font-size: 11px; font-weight: 650; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; padding-top: 4px; }

    .toast { position: fixed; right: 22px; bottom: 20px; z-index: 5; max-width: min(360px, calc(100vw - 32px)); padding: 11px 15px; transform: translateY(12px); border-radius: 9px; background: #263d2e; color: white; box-shadow: var(--shadow); font-size: 12px; opacity: 0; pointer-events: none; transition: transform .2s, opacity .2s; }
    .toast.show { transform: translateY(0); opacity: 1; }

    @media (max-width: 1050px) {
      .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .content-grid { grid-template-columns: minmax(0, 1fr); }
      .module-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 720px) {
      .layout { display: block; }
      .sidebar { position: sticky; z-index: 4; top: 0; width: 100%; height: auto; padding: 9px 13px 7px; border-right: 0; border-bottom: 1px solid var(--line); }
      .brand { display: none; }
      .company-switcher { display: none; }
      .nav-label, .sidebar-spacer, .season-card, .profile { display: none; }
      .nav { display: flex; justify-content: space-between; gap: 2px; }
      .nav-button { flex: 1; min-height: 40px; justify-content: center; gap: 6px; padding: 0 5px; font-size: 11px; }
      .nav-icon { width: auto; font-size: 14px; }
      .main { padding: 20px 16px 35px; }
      .topbar { margin-bottom: 23px; }
    }
    @media (max-width: 520px) {
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
      .metric { padding: 12px; }
      .page-heading { align-items: flex-start; flex-direction: column; }
      .heading-actions { width: 100%; }
      .heading-actions .button { flex: 1; }
      .round-indicator { font-size: 10px; }
      .module-grid { grid-template-columns: 1fr; }
      .team-add-form { grid-template-columns: 1fr; }
      .team-table th:nth-child(3), .team-table td:nth-child(3) { display: none; }
      .decision-foot { align-items: flex-start; flex-direction: column; }
      .decision-foot .button { width: 100%; }
      .day-controls { align-items: stretch; flex-direction: column; }
      .day-controls label { min-height: 34px; }
      .day-controls .button { width: 100%; }
      .location-layout { grid-template-columns: minmax(0, .8fr) minmax(0, 1fr); gap: 8px; }
      .location-controls select { font-size: 11px; }
      .location-stat { padding: 8px; }
      .taiwan-map { max-height: 240px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

      function escapeHtml(value) {

        return city[language];
      }

      function industryName(industry) {
        const industryKeys = {
          Retail: "retail", "Consumer goods": "consumerGoods", "Food & beverage": "food",
          Technology: "technology", Manufacturing: "manufacturing"
        };
        return industryKeys[industry] ? t(industryKeys[industry]) : industry;
      }

      function roleName(role) {
        if (language === "en") return role;
        const roleKeys = {
          "General Manager": "roleGM", Operations: "roleOps", Marketing: "roleMarketing", Finance: "roleFinance",
          "Human Resources": "people", "Supply Chain": "roleOps", Strategy: "strategy"
        };
        return roleKeys[role] ? t(roleKeys[role]) : role;
      }

      function initials(name) {
        return String(name).trim().split(/\s+/).slice(0, 2).map(part => part[0] || "").join("").toUpperCase();
      }

      function showToast(message) {
        toastElement.textContent = message;
        toastElement.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastElement.classList.remove("show"), 2600);
      }

      function updateChrome() {
        document.documentElement.lang = language === "zh" ? "zh-Hant" : "en";
        document.querySelector("#sidebar-company").textContent = state.company.name;
        document.querySelector("#sidebar-industry").textContent = `${industryName(state.company.industry)} · ${t("cohort")}`;
        document.querySelector("#company-initial").textContent = initials(state.company.name).slice(0, 1) || "F";
        document.querySelector("#owner-name").textContent = state.company.owner;
        document.querySelector("#owner-avatar").textContent = initials(state.company.owner);
        document.querySelector("#round-indicator").textContent = String(state.day).padStart(2, "0");
        document.querySelector("#day-prefix").textContent = language === "zh" ? "第" : "Day";
        document.querySelector("#day-suffix").textContent = language === "zh" ? "天 / 30 天" : "of 30";
        document.querySelector("#sidebar-season").textContent = state.day > 30
          ? t("seasonComplete")
          : t("retailDay", { day: state.day });
        document.querySelector("#sidebar-season-label").textContent = t("simulationSeason");
        document.querySelector("#sidebar-season-sub").textContent = t("storePrivate");
        document.querySelector("#nav-label").textContent = t("workspace");
        document.querySelector("#breadcrumb-root").textContent = t("workspace");
        document.querySelector("#breadcrumb-view").textContent = t(currentView);
        document.querySelector("#locale-toggle").textContent = language === "en" ? "中" : "EN";
        document.querySelector("#locale-toggle").setAttribute("aria-label", language === "en" ? "Switch to Traditional Chinese" : "切換為英文");
        const companyButton = document.querySelector("#edit-company-top");
        companyButton.innerHTML = `<span aria-hidden="true">⚙</span>${t("companySetup")}`;
        document.querySelectorAll(".nav-button").forEach(button => {
          if (button.dataset.view === currentView) button.setAttribute("aria-current", "page");
          else button.removeAttribute("aria-current");
          button.lastChild.textContent = t(button.dataset.view);
        });
        document.querySelector("#brand-caption").textContent = language === "zh" ? "商業模擬實驗室" : "Business Simulation Lab";
        document.querySelector("#profile-role").textContent = language === "zh" ? "公司負責人" : "Company owner";
        document.querySelector("#company-initial").setAttribute("aria-label", `${state.company.name} ${t("companySetup")}`);
        document.title = `Fieldwork — ${language === "zh" ? "零售商業模擬" : "Retail Business Simulation"}`;
        localizeCompanyDialog();
      }

      function localizeCompanyDialog() {
        const dialog = document.querySelector("#company-dialog");
        dialog.querySelector("#company-dialog-title").textContent = t("companyDialogTitle");
        dialog.querySelector(".dialog-head p").textContent = t("companyDialogDescription");
        const labels = dialog.querySelectorAll(".dialog-form label");
        labels[0].firstChild.textContent = t("companyName");
        labels[1].firstChild.textContent = t("industry");
        labels[2].firstChild.textContent = t("companyOwnerField");
        dialog.querySelector(".dialog-close").setAttribute("aria-label", t("cancel"));
        dialog.querySelector(".dialog-actions [data-close-dialog]").textContent = t("cancel");
        dialog.querySelector('[type="submit"]').textContent = t("saveCompany");
        const options = dialog.querySelector("#industry-input").options;
        const industryKeys = ["retail", "consumerGoods", "food", "technology", "manufacturing"];
        [...options].forEach((option, index) => { option.textContent = t(industryKeys[index]); });
      }

      const pageInfo = {
        overview: { title: "overview", kicker: "companyDashboard", description: "overviewDescription" },
        departments: { title: "departments", kicker: "businessFunctions", description: "departmentsDescription" },
        team: { title: "team", kicker: "peopleRoles", description: "teamDescription" },
        reports: { title: "reports", kicker: "performance", description: "reportsDescription" }
      };

      function render() {
        updateChrome();
        const info = pageInfo[currentView];
        const heading = `<section class="page-heading"><div><p class="page-kicker">${t(info.kicker)}</p><h1>${currentView === "overview" ? t("goodMorning", { name: escapeHtml(state.company.owner.split(" ")[0]) }) : t(info.title)}</h1><p class="page-description">${t(info.description)}</p></div></section>`;
        if (currentView === "overview") viewRoot.innerHTML = heading + renderOverview();
        if (currentView === "departments") viewRoot.innerHTML = heading + renderDepartments();
        if (currentView === "team") viewRoot.innerHTML = heading + renderTeam();
        if (currentView === "reports") viewRoot.innerHTML = heading + renderReports();
        bindViewEvents();
      }

      function renderAlerts() {
        const alerts = [];
        if (state.cash < 2500) alerts.push(t("cashWarning"));
        if (openStores().some(store => store.inventory < 35)) alerts.push(t("stockWarning"));
        if (!alerts.length) return "";
        return alerts.map(message => `<div class="alert"><span class="alert-icon" aria-hidden="true">⚠</span><span>${message}</span></div>`).join("");
      }

      function renderMetrics() {
        const liveProfit = state.dailyRevenue - state.dailyCogs;
        const profitClass = liveProfit > 0 ? "positive" : liveProfit < 0 ? "negative" : "";
        return `<div class="metrics">
          <article class="metric"><div class="metric-top"><span>${t("cash")}</span><span class="metric-icon">$</span></div><div class="metric-value" id="live-cash">${money(state.cash, true)}</div><div class="metric-change">${t("availableCash")}</div></article>
          <article class="metric"><div class="metric-top"><span>${t("todayRevenue")}</span><span class="metric-icon">↗</span></div><div class="metric-value" id="live-revenue">${money(state.dailyRevenue, true)}</div><div class="metric-change" id="live-sales-caption">${t("salesToday", { units: state.dailyUnitsSold })}</div></article>
          <article class="metric"><div class="metric-top"><span>${t("grossProfit")}</span><span class="metric-icon">⌁</span></div><div class="metric-value" id="live-profit">${money(liveProfit, true)}</div><div class="metric-change ${profitClass}">${t("lessProductCost")}</div></article>
          ${openStores().length ? `<article class="metric"><div class="metric-top"><span>${t("inventory")}</span><span class="metric-icon">▣</span></div><div class="metric-value" id="live-inventory">${totalInventory().toLocaleString()} <span style="font-size:12px;font-weight:500;letter-spacing:0">${t("units")}</span></div><div class="metric-change">${t("finishedGoods")}</div></article>` : ""}
          <article class="metric"><div class="metric-top"><span>${t("sentiment")}</span><span class="metric-icon">♡</span></div><div class="metric-value">${state.satisfaction}<span style="font-size:13px;font-weight:500">/100</span></div><div class="metric-change">${state.satisfaction >= 70 ? t("customersGood") : t("needsAttention")}</div></article>
        </div>`;
      }

      function chartMarkup(history = state.history) {
        const entries = history.slice(-7);
        if (!entries.length) {
          return `<div class="chart-wrap"><svg viewBox="0 0 360 210" role="img" aria-label="Revenue trend will appear after the first round">
            <line class="chart-grid" x1="36" y1="42" x2="342" y2="42"></line><line class="chart-grid" x1="36" y1="86" x2="342" y2="86"></line><line class="chart-grid" x1="36" y1="130" x2="342" y2="130"></line><line class="chart-grid" x1="36" y1="176" x2="342" y2="176"></line>
            <text class="chart-label" x="189" y="106" text-anchor="middle">${t("firstDayChart")}</text>
          </svg></div>`;
        }
        const values = entries.map(round => round.revenue);
        const min = Math.min(...values, 0);
        const max = Math.max(...values, 1);
        const range = Math.max(max - min, 1);
        const points = values.map((value, index) => {
          const x = values.length === 1 ? 330 : 38 + (index * 292) / (values.length - 1);
          const y = 174 - ((value - min) / range) * 132;
          return { x, y };
        });
        const line = points.map(point => `${point.x},${point.y}`).join(" ");
        const area = `${points[0].x},184 ${line} ${points[points.length - 1].x},184`;
        const labels = points.map((point, index) => `<text class="chart-label" x="${point.x}" y="202" text-anchor="middle">Day ${entries[index].day}</text>`).join("");
        const dots = points.map(point => `<circle class="chart-dot" cx="${point.x}" cy="${point.y}" r="4"></circle>`).join("");
        return `<div class="chart-wrap"><svg viewBox="0 0 360 210" role="img" aria-label="${language === "zh" ? `最近 ${values.length} 天營收趨勢` : `Revenue trend over the last ${values.length} days`}">
          <defs><linearGradient id="chartFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="var(--green)" stop-opacity=".18"/><stop offset="100%" stop-color="var(--green)" stop-opacity="0"/></linearGradient></defs>
          <line class="chart-grid" x1="36" y1="42" x2="342" y2="42"></line><line class="chart-grid" x1="36" y1="86" x2="342" y2="86"></line><line class="chart-grid" x1="36" y1="130" x2="342" y2="130"></line><line class="chart-grid" x1="36" y1="176" x2="342" y2="176"></line>
          <polygon class="chart-area" points="${area}"></polygon><polyline class="chart-line" points="${line}"></polyline>${dots}${labels}
        </svg></div>`;
      }

      function decisionForm() {
        const availableStores = openStores();
        const preferredStore = storeByCity(state.purchaseCity || state.city);
        const selectedStore = preferredStore && preferredStore.isOpen ? preferredStore : availableStores[0];
        const restockCapacity = selectedStore
          ? sizeById(selectedStore.size).capacity - selectedStore.inventory - pendingForStore(selectedStore)
          : 0;
        return `<div class="simulation-bar">
            <div class="simulation-status"><span class="status-dot ${state.isRunning ? "running" : ""}" id="simulation-dot"></span><span id="simulation-status">${state.isRunning ? t("storeOpen") : t("storeClosed")}</span></div>
            <span class="day-clock" id="day-clock">${formatClock(state.isRunning ? Math.max(0, state.dayEndsAt - Date.now()) : (state.pausedRemainingMs || state.dayDurationSeconds * 1000))}</span>
          </div>
          <div class="day-progress" role="progressbar" aria-label="${language === "zh" ? "每日營業進度" : "Day progress"}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="day-progress-fill"></span></div>
          <div class="day-controls">
            <label for="day-duration">${t("dayLength")}
              <input id="day-duration" type="number" min="10" max="200" step="1" value="${state.dayDurationSeconds}" aria-label="Simulation day length in seconds" ${state.isRunning ? "disabled" : ""}>
              <span>${t("seconds")}</span>
            </label>
            <button class="button ${state.isRunning ? "" : "button-primary"}" type="button" data-action="${state.runId ? "toggle-simulation" : "new-run"}">${state.isRunning ? t("runPause") : state.runStatus === "paused" ? t("runResume") : t("runStart")}</button>
            ${state.runId && state.runStatus !== "ended" ? `<button class="button button-danger" type="button" data-action="end-run">${t("runEnd")}</button>` : ""}
          </div>
          <div class="price-control">
            <div class="price-heading"><strong>${t("sellingPrice")}</strong><output id="price-output">${money(state.currentPrice)}</output></div>
            <input id="selling-price" type="range" min="80" max="1200" step="10" value="${state.currentPrice}" aria-label="${t("sellingPrice")}">
            <div class="price-range-labels"><span>${t("competitive")}</span><span>${t("premium")}</span></div>
          </div>
          <div class="procurement">
            <div class="procurement-copy"><strong>${t("restock")}</strong><small>${t("perUnitCash", { cost: UNIT_COST, cash: money(state.cash, true) })}</small></div>
            <label class="purchase-target">${t("purchaseTarget")}<select id="purchase-store" aria-label="${t("purchaseTarget")}" ${availableStores.length ? "" : "disabled"}>
              ${availableStores.map(store => `<option value="${store.city}" ${selectedStore && store.city === selectedStore.city ? "selected" : ""}>${cityName(cityById(store.city))}</option>`).join("")}
            </select></label>
            <select id="purchase-quantity" aria-label="Purchase quantity" ${selectedStore ? "" : "disabled"}>
              ${[10, 25, 50, 100].map(quantity => `<option value="${quantity}" ${quantity > restockCapacity ? "disabled" : ""}>${quantity} ${t("units")} · ${money(quantity * UNIT_COST)}</option>`).join("")}
            </select>
            <button class="button" type="button" data-action="purchase" ${selectedStore && restockCapacity >= 10 ? "" : "disabled"}>${t("buyStock")}</button>
            <small class="delivery-note" id="delivery-note">${selectedStore && pendingForStore(selectedStore) ? `${t("delivery")}: ${pendingForStore(selectedStore).toLocaleString()} ${t("units")} · ${t("deliveryArrives", { day: earliestArrival(selectedStore) })}` : selectedStore ? t("noPendingDelivery") : t("noStoresOpen")}</small>
          </div>
          <div class="store-totals">
            <div class="store-total"><small>${t("soldToday")}</small><strong id="today-units">${state.dailyUnitsSold} ${t("units")}</strong></div>
            <div class="store-total"><small>${t("todaySales")}</small><strong id="today-revenue">${money(state.dailyRevenue, true)}</strong></div>
          </div>`;
      }

      function renderLocationPanel() {
        const selectedCity = cityById();
        const selectedStore = storeByCity();
        const selectedSize = sizeById(selectedStore.size);
        const markers = cities.map(city => {
          const selected = city.id === state.city;
          const store = storeByCity(city.id);
          const label = cityName(city);
          return `<g class="city-marker ${selected ? "selected" : ""} ${store.isOpen ? "store-open" : ""}" data-city="${city.id}" tabindex="0" role="button" aria-label="${language === "zh" ? "選擇" : "Choose"} ${label} · ${store.isOpen ? t("openStatus") : t("closedStatus")}" aria-pressed="${selected}">
            <circle cx="${city.x}" cy="${city.y}" r="${selected ? 7 : 5}"></circle>
            <text x="${city.x + city.dx}" y="${city.y + city.dy}">${label}</text>
          </g>`;
        }).join("");
        return `<section class="panel">
          <div class="panel-head"><div><h2 class="panel-title">${t("locationMap")}</h2><p class="panel-subtitle">${t("locationHint")}</p></div></div>
          <div class="panel-body"><div class="location-layout">
            <svg class="taiwan-map" viewBox="0 0 230 380" role="img" aria-label="${language === "zh" ? "台灣門市選址地圖" : "Taiwan store location map"}">
              <path class="taiwan-shape" d="M142 12 C158 19 168 30 170 45 L178 60 171 78 179 95 168 116 166 137 151 158 151 178 140 199 134 222 119 243 116 265 101 287 98 310 83 331 75 354 61 368 50 356 54 338 62 318 64 298 74 278 75 255 86 236 84 216 96 197 94 177 105 158 105 137 116 119 115 98 128 79 126 60 137 43 132 27 Z"/>
              <path d="M178 309c9-3 15 2 14 8-2 7-11 10-17 5-4-4-2-10 3-13Z" fill="var(--green-soft)" stroke="var(--green)" stroke-width="1.5"/>
              ${markers}
            </svg>
            <div class="location-controls">
              <label>${t("selectCity")}<select id="city-select" aria-label="${t("selectCity")}">${cities.map(city => `<option value="${city.id}" ${city.id === state.city ? "selected" : ""}>${cityName(city)}</option>`).join("")}</select></label>
              <label>${t("chooseSize")}<select id="store-size-select" aria-label="${t("chooseSize")}" ${state.isRunning ? "disabled" : ""}>${storeSizes.map(size => `<option value="${size.id}" ${size.id === selectedStore.size ? "selected" : ""} ${size.capacity < selectedStore.inventory + pendingForStore(selectedStore) ? "disabled" : ""}>${size[language]}</option>`).join("")}</select></label>
              <div class="store-opening"><span class="role-pill">${selectedStore.isOpen ? t("openStatus") : t("closedStatus")}</span><button class="button ${selectedStore.isOpen ? "" : "button-primary"}" type="button" data-action="toggle-store" ${state.isRunning ? "disabled" : ""}>${selectedStore.isOpen ? t("storeCloseAction") : t("storeOpenAction")}</button></div>
              <div class="location-info">
                <div class="location-stat"><small>${t("dailyRent")}</small><strong>${money(selectedStore.isOpen ? storeRent(selectedStore) : 0)} / ${language === "zh" ? "天" : "day"}</strong></div>
                <div class="location-stat"><small>${t("footTraffic")}</small><strong>×${selectedCity.traffic.toFixed(2)}</strong></div>
                <div class="location-stat"><small>${t("stockCapacity")}</small><strong>${selectedSize.capacity} ${t("units")}</strong></div>
                ${selectedStore.isOpen ? `<div class="location-stat"><small>${t("inventoryOnHand")}</small><strong id="location-inventory">${selectedStore.inventory} ${t("units")}</strong></div>` : `<div class="location-stat"><small>${t("storeOpening")}</small><strong>${t("closedStatus")}</strong></div>`}
                <div class="location-stat"><small>${t("cityDemand")}</small><strong>${Math.round(selectedCity.purchaseChance * 100)}% / ${language === "zh" ? "秒" : "sec"}</strong></div>
              </div>
            </div>
          </div><p class="map-note">${t("mapNote")}</p></div>
        </section>`;
      }

      function renderInventoryPanel() {
        const stores = openStores();
        if (!stores.length) return `<section class="panel"><div class="panel-head"><div><h2 class="panel-title">${t("inventoryDisplay")}</h2><p class="panel-subtitle">${t("inventorySubtitle")}</p></div></div><div class="panel-body"><p class="empty-history">${t("noStoresOpen")}</p></div></section>`;
        const cards = stores.map(store => {
          const capacity = sizeById(store.size).capacity;
          const fill = Math.min(100, store.inventory / capacity * 100);
          const filledBoxes = store.inventory <= 0 ? 0 : Math.min(18, Math.ceil(fill / 100 * 18));
          const boxes = Array.from({ length: 18 }, (_, index) => `<span class="stock-box ${index >= filledBoxes ? "empty" : ""}" aria-hidden="true">▦</span>`);
          const rows = [boxes.slice(0, 6), boxes.slice(6, 12), boxes.slice(12, 18)].map((row, index) => `<div class="shelf-row" aria-label="${t("shelfLabels")[index]}">${row.join("")}</div>`).join("");
          const status = store.inventory === 0 ? t("noStock") : fill < 25 ? t("lowStock") : t("healthyStock");
          return `<article class="store-stock" data-store-city="${store.city}">
            <div class="stock-summary"><strong data-store-inventory>${store.inventory} ${t("units")}</strong><span>${t("stockRemaining", { stock: store.inventory, capacity })}</span></div>
            <div class="stock-capacity ${fill < 25 ? "low" : ""}" role="img"><span style="width:${fill}%"></span></div>
            <div class="stock-shelves" role="img" aria-label="${t("inventoryDisplay")} · ${store.inventory} ${t("units")}">${rows}</div>
            <div class="stock-legend"><span>${t("lowStock")}</span><span class="${store.inventory === 0 || fill < 25 ? "low" : ""}">${status}</span><span>${t("healthyStock")}</span></div>
            <div class="stock-caption"><span>${t("stockCapacity")}: ${capacity} ${t("units")}</span><span>${cityName(cityById(store.city))} · ${sizeById(store.size)[language]}</span></div>
            ${pendingForStore(store) ? `<div class="delivery-note">${t("delivery")}: ${pendingForStore(store)} ${t("units")} · ${t("deliveryArrives", { day: earliestArrival(store) })}</div>` : ""}
          </article>`;
        }).join("");
        return `<section class="panel">
          <div class="panel-head"><div><h2 class="panel-title">${t("inventoryDisplay")}</h2><p class="panel-subtitle">${t("inventorySubtitle")}</p></div><span class="role-pill">${t("inventoryLabels")[Math.min(2, Math.floor((state.day - 1) / 10))]}</span></div>
          <div class="panel-body store-stock-list">
            ${cards}
          </div>
        </section>`;
      }

      function renderDecisionPanel() {
        if (state.runStatus === "ended" || state.day > 30) {
          return `<section class="panel decision-panel"><div class="panel-head"><div><h2 class="panel-title">${t("seasonTitle")}</h2><p class="panel-subtitle">${t("seasonSubtitle")}</p></div></div><div class="panel-body"><p class="page-description">${t("seasonDescription")}</p><button class="button" type="button" data-view-link="reports">${t("viewReports")}</button> <button class="button button-primary" type="button" data-action="new-run">${t("runStart")}</button></div></section>`;
        }
        return `<section class="panel decision-panel"><div class="panel-head"><div><h2 class="panel-title">${t("retailDay", { day: state.day })}</h2><p class="panel-subtitle">${t("daySubtitle")}</p></div></div>${decisionForm()}</section>`;
      }

      function renderOverview() {
        return `${renderAlerts()}${renderMetrics()}<div class="content-grid">
          <div><section class="panel"><div class="panel-head"><div><h2 class="panel-title">${t("revenuePerformance")}</h2><p class="panel-subtitle">${t("revenueRecent")}</p></div><div class="chart-legend"><span class="legend-dot"></span>${t("revenue")}</div></div><div class="panel-body">${chartMarkup()}</div></section>
          ${renderLocationPanel()}
          ${renderInventoryPanel()}
          <section class="panel"><div class="panel-head"><div><h2 class="panel-title">${t("recentActivity")}</h2><p class="panel-subtitle">${t("companyActivity")}</p></div></div><div class="panel-body"><div class="activity-list">${renderActivity()}</div></div></section></div>
          <div>${renderDecisionPanel()}
          <section class="panel"><div class="panel-head"><div><h2 class="panel-title">${t("leadershipTeam")}</h2><p class="panel-subtitle">${t("peopleOnTeam", { count: state.team.length })}</p></div><button class="button" type="button" data-view-link="team">${t("manage")}</button></div><div class="panel-body"><div class="team-list">${renderMemberCards()}</div></div></section></div>
        </div>`;
      }

      function renderActivity() {
        if (!state.activity.length) return `<div class="empty-history">${t("companyActivity")}</div>`;
        return state.activity.slice(0, 4).map(item => `<div class="activity-item"><span class="activity-mark ${item.warning ? "warning" : ""}">${escapeHtml(item.icon || "•")}</span><div class="activity-copy">${escapeHtml(activityMessage(item))}<span class="activity-time">${t("day")} ${item.day}</span></div></div>`).join("");
      }

      function activityMessage(item) {
        if (item.kind === "dayClosed") return t("dayClosed", {
          day: item.day, units: item.units, revenue: money(item.revenue), profit: money(item.profit)
        });
        if (item.kind === "rentCharged") return t("rentExpense", { rent: money(item.rent), count: item.count });
        if (item.kind === "restocked") return t("restocked", { count: item.count, amount: money(item.amount) });
        if (item.kind === "orderPlaced") return t("orderPlaced", { count: item.count, store: cityName(cityById(item.city)), day: item.arrivesOn });
        if (item.kind === "deliveryReceived") return t("deliveryReceived", { count: item.count, store: cityName(cityById(item.city)) });
        if (item.kind === "memberJoined") return t("memberJoined", { name: item.name, role: roleName(item.role) });
        if (item.kind === "memberRemoved") return t("memberRemoved", { name: item.name });
        if (item.kind === "lowInventoryActivity") return t("lowInventoryActivity");
        if (item.kind) return t(item.kind);
        return item.text || "";
      }

      function operationDescription(item) {
        const city = item.city ? cityName(cityById(item.city)) : "";
        const descriptions = {
          practice_started: () => t("opPracticeStarted", { cash: money(item.cash || 0) }),
          simulation_started: () => t("opSimulationStarted"),
          practice_paused: () => t("opPaused"),
          practice_resumed: () => t("opResumed"),
          practice_ended: () => t("opEnded", { cash: money(item.cash || 0) }),
          day_settled: () => t("opDaySettled", { day: item.day, revenue: money(item.revenue || 0), expenses: money(item.expenses || 0) }),

          <div class="run-summary"><div class="location-stat"><small>${t("cashAtStart")}</small><strong>${money(selectedRun.startingCash || 0)}</strong></div><div class="location-stat"><small>${t("finalCash")}</small><strong>${money(selectedRun.finalCash || 0)}</strong></div><div class="location-stat"><small>${t("revenue")}</small><strong>${money(selectedRun.totalRevenue || 0)}</strong></div><div class="location-stat"><small>${t("totalCosts")}</small><strong>${money(selectedRun.totalExpenses || 0)}</strong></div><div class="location-stat"><small>${t("actionsRecorded")}</small><strong>${operations.length}</strong></div></div>${chartMarkup(history)}</div></section>
          <section class="panel" style="margin-top:16px"><div class="panel-head"><div><h2 class="panel-title">${t("dailyResults")}</h2><p class="panel-subtitle">${t("dailyResultsSubtitle")}</p></div><span class="role-pill">${t("daysRecorded", { count: history.length })}</span></div><div class="panel-body" style="overflow-x:auto">${history.length ? `<table class="history-table"><thead><tr><th>${t("day")}</th><th>${t("revenue")}</th><th>${t("grossProfitColumn")}</th><th>${t("sold")}</th><th>${t("purchased")}</th><th>${t("endingStock")}</th><th>${t("dailyRent")}</th></tr></thead><tbody>${rows}</tbody></table>` : `<div class="empty-history">${t("noDays")}</div>`}</div></section>
          ${storeRows ? `<section class="panel" style="margin-top:16px"><div class="panel-head"><div><h2 class="panel-title">${t("storeResults")}</h2></div></div><div class="panel-body" style="overflow-x:auto"><table class="history-table"><thead><tr><th>${t("day")}</th><th>${t("selectCity")}</th><th>${t("revenue")}</th><th>${t("grossProfitColumn")}</th><th>${t("sold")}</th><th>${t("purchased")}</th><th>${t("endingStock")}</th><th>${t("dailyRent")}</th></tr></thead><tbody>${storeRows}</tbody></table></div></section>` : ""}
          <section class="panel" style="margin-top:16px"><div class="panel-head"><div><h2 class="panel-title">${t("operationHistory")}</h2></div></div><div class="panel-body">${operationRows ? `<div class="operation-list">${operationRows}</div>` : `<div class="empty-history">${t("noOperations")}</div>`}</div></section>`;
